buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.1.0'
    }
}

allprojects {

    ext {
        appName = 'Shattered Pixel Dungeon'
        appPackageName = 'com.shatteredpixel.shatteredpixeldungeon'

        appVersionCode = 896
        appVersionName = '3.3.8'

        appJavaCompatibility = JavaVersion.VERSION_11

        appAndroidCompileSDK = 36   //Android 15
        appAndroidMinSDK = 21       //Android 5.0
        appAndroidTargetSDK = 36    //Android 15

        gdxVersion = '1.14.0'
        gdxControllersVersion = '2.2.4'
        robovmVersion = '2.3.24'
    }
    version = appVersionName

    //iCloud evicts and duplicates files in synced folders (Documents/Desktop), which makes
    // gradle hang. When the project lives there, build outputs are kept outside of iCloud.
    def home = System.getProperty('user.home')
    if (rootDir.absolutePath.startsWith(home + '/Documents') || rootDir.absolutePath.startsWith(home + '/Desktop')) {
        layout.buildDirectory = new File(home, '.spd-build/' + (project.path == ':' ? 'root' : project.path.substring(1).replace(':', '_')))
    }

    //RoboVM (iOS) has no StringConcatFactory, so string concatenation is compiled the Java 8 way
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-XDstringConcat=inline']
    }

    repositories {
        google()
        mavenCentral()
        maven { url 'https://central.sonatype.com/repository/maven-snapshots/' }
    }

}