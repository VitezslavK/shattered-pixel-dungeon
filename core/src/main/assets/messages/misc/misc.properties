mechanics.runes.fehu_title=rune of wealth
mechanics.runes.fehu_desc=All gold you pick up is increased by 10%.
mechanics.runes.uruz_title=rune of strength
mechanics.runes.uruz_desc=Every hero has 5 more maximum health.
mechanics.runes.kenaz_title=rune of light
mechanics.runes.kenaz_desc=Every hero can see 1 tile further.
mechanics.runes.algiz_title=rune of protection
mechanics.runes.algiz_desc=Reaching a new floor for the first time grants some shielding.
mechanics.runes.berkano_title=rune of growth
mechanics.runes.berkano_desc=All experience you earn is increased by 10%.
mechanics.runes.ansuz_title=rune of wisdom
mechanics.runes.ansuz_desc=At the start of each run, one random type of potion is already identified.
journal.discoveries.new_rune=Rune deciphered: %s! Its blessing will follow you in every future run.
levels.level.path_title=A fork in the path
levels.level.path_desc=The stairs split as they descend. One path leads to the familiar caves. The other is colder, and from deep below you hear the creak of ice.\n\nIn the _ice caves_ every monster is frostbound and chills on hit, and the floors are full of water, but each floor holds extra treasure.\n\nThis choice cannot be changed later.
levels.level.path_classic=The familiar caves
levels.level.path_ice=The ice caves

###burned_city
levels.level.path_desc_city=The stairs split once more. One path leads down into the dwarven city as you know it. From the other rises thick smoke and the glow of embers: part of the city never stopped burning.\n\nIn the _burned city_ every monster is emberbound and can set you on fire, and the floors are scorched, but each floor holds extra treasure.\n\nThis choice cannot be changed later.
levels.level.path_classic_city=The dwarven city
levels.level.path_burned=The burned city

###variability
mechanics.floorevent.blood_moon_title=blood moon
mechanics.floorevent.blood_moon_desc=A blood moon hangs over this floor. The monsters here are stronger, but they give more experience and there is more loot.
mechanics.floorevent.mist_title=mist
mechanics.floorevent.mist_desc=A thick mist fills this floor. You can't see very far.
mechanics.floorevent.gold_rush_title=gold rush
mechanics.floorevent.gold_rush_desc=You hear the clink of coins. Extra gold is scattered around this floor.
mechanics.floorevent.treasure_goblin_title=treasure goblin
mechanics.floorevent.treasure_goblin_desc=You hear nervous giggling and the jingle of a heavy sack. A treasure goblin is hiding on this floor. Catch it before it escapes!
mechanics.floorevent.quiet_title=quiet floor
mechanics.floorevent.quiet_desc=This floor is eerily quiet. There seem to be far fewer monsters here.
mechanics.runmodifier.title=Choose a run modifier
mechanics.runmodifier.offer=You may pick one twist for this run. Each one has an upside and a downside.
mechanics.runmodifier.none=No modifier
mechanics.runmodifier.chosen=Run modifier chosen: %s
mechanics.runmodifier.glass_cannon_title=glass cannon
