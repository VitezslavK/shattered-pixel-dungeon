rankings$record.won=Obtained the Amulet of Yendor
rankings$record.ascended=Ascended with the Amulet!
###endings
endings.escape_title=Escape with the Amulet
endings.escape_text=You return to the surface with the Amulet of Yendor in hand. Whatever power it holds is yours to study, to sell, or to hide away. The dungeon below falls quiet, but you know that it is never truly empty.
endings.liberator_title=The Liberator
endings.liberator_text=Word of your deeds spread through the depths. The sad ghost, the old wandmaker, the troll blacksmith and the dwarven imp all owe you their freedom, and they guide you safely back to the surface. With their help the dungeon's last prisoners escape too, and the city above welcomes back people it had long given up for lost.
endings.destroyer_title=The Amulet Destroyed
endings.destroyer_text=The guardian falls, and with it the Amulet of Yendor shatters into dust. The dungeon shudders as the power that held it together fades away. You barely make it out before the depths collapse behind you. No one will ever claim the amulet's power again.
endings.dark_lord_title=The New Master of the Depths
endings.dark_lord_text=You place the amulet around your neck. Its power floods into you, and the whispers that once drove Yog-Dzewa now speak in your voice. You do not return to the surface. The monsters of the dungeon kneel before their new master, and somewhere far above, the city begins to fear the dark once more.
endings.keeper_title=Keeper of the Depths
endings.keeper_text=You fuse the remains of the dungeon's hidden rulers with the amulet, forging the Key of the Depths. The dungeon falls silent and obeys you, not as its tyrant but as its warden. You seal the amulet's power away forever, and remain below to make sure nothing ever claims it again.

###discoveries
mechanics.reactions.conduction_title=conduction
mechanics.reactions.conduction_desc=Electricity striking a creature standing in water deals 30% more damage, and the current spreads to every other creature in water within 2 tiles.
mechanics.reactions.conduction_hint=Something about lightning and puddles...
mechanics.reactions.shatter_title=shatter
mechanics.reactions.shatter_desc=Physically hitting a frozen creature shatters the ice, dealing 50% more damage.
mechanics.reactions.shatter_hint=Ice is brittle when struck.
mechanics.reactions.flash_freeze_title=flash freeze
mechanics.reactions.flash_freeze_desc=Chilling a creature that stands in water instantly freezes it solid for 2 turns.
mechanics.reactions.flash_freeze_hint=Cold and water don't mix gently.
mechanics.reactions.steam_burst_title=steam burst
mechanics.reactions.steam_burst_desc=Setting a chilled or frozen creature on fire flashes the ice into scalding steam, dealing damage and blinding it for 2 turns.
mechanics.reactions.steam_burst_hint=What happens when fire meets ice?
mechanics.reactions.cleansing_fire_title=cleansing fire
mechanics.reactions.cleansing_fire_desc=Fire burns away plague. The infected creature takes extra damage, but the plague is gone and can no longer spread.
mechanics.reactions.cleansing_fire_hint=Some diseases fear flame.
mechanics.reactions.toxic_ignition_title=toxic ignition
mechanics.reactions.toxic_ignition_desc=Fire igniting a creature inside toxic gas makes the gas explode, damaging everything nearby and burning the gas away.
mechanics.reactions.toxic_ignition_hint=Toxic fumes might be flammable.
mechanics.reactions.caustic_blood_title=caustic blood
mechanics.reactions.caustic_blood_desc=Corrosion eating into an open wound instantly deals all of the remaining bleeding damage at once.
mechanics.reactions.caustic_blood_hint=Acid and open wounds...
mechanics.reactions$reactiondamage.name=elemental reaction
mechanics.reactions$reactiondamage.rankings_desc=Killed by an elemental reaction
journal.discoveries.new_discovery=New discovery: %s! It has been added to your codex.

