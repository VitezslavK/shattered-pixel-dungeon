//core game code modules
include ':SPD-classes'
include ':core'

//platform modules (-PwebOnly skips the ones that need the Android SDK or RoboVM, used by the web build on GitHub)
if (!providers.gradleProperty('webOnly').isPresent()) {
    include ':android'
    include ':ios'
}
include ':desktop'

//service modules
include ':services'
    //updates
    include ':services:updates:debugUpdates'
    include ':services:updates:githubUpdates'
    //news
    include ':services:news:debugNews'
    include ':services:news:shatteredNews'
//browser version, see web/build.gradle
include ':web'
