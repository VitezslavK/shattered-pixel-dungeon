<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<title>SPD Mod</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="SPD Mod">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-256.png">
<link rel="icon" href="icon-128.png">
<style>
html, body { margin: 0; padding: 0; background: #000; width: 100%; height: 100%; overflow: hidden;
	overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#canvas { display: block; touch-action: none; }
#loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
	color: #9fe7c0; font: 16px -apple-system, sans-serif; text-align: center; }
#loading img { width: 96px; height: 96px; image-rendering: pixelated; margin-bottom: 16px; }
</style>
</head>
<body oncontextmenu="return false">
<div id="loading"><img src="icon-128.png" alt=""><div>Načítám hru…</div></div>
<canvas id="canvas"></canvas>
<script>
window.addEventListener("load", function () {
	document.getElementById("loading").remove();
	main();
});
</script>
<script src="app.js"></script>
</body>
</html>
